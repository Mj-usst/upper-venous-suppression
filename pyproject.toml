[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lympclear"
version = "1.0.0"
description = "Venous segmentation and dual-mode postprocessing for MR lymphangiography"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Jian Ma"}]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-image",
  "nibabel",
  "SimpleITK",
  "pydicom",
  "imageio",
  "tqdm",
  "PyYAML",
  "matplotlib",
]

[tool.setuptools.packages.find]
include = ["lympclear*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
